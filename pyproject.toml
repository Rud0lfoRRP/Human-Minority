[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "human-minority"
dynamic = ["version"]
description = "Human Minority public verification product"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
human-minority = "human_minority.cli:main"

[tool.setuptools.dynamic]
version = {attr = "human_minority._version.__version__"}

[tool.setuptools.packages.find]
include = ["human_minority*", "seed*"]
exclude = ["tests*"]
