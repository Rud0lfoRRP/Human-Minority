name: Public CI

on:
  push:
    branches: [main]
  pull_request:
  public:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    if: ${{ github.event.repository.private == false }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-test.txt

      - name: Compile public runtime
        run: python -m compileall -q seed

      - name: Run tests
        run: python -m pytest -q

  gate:
    name: Public CI Gate
    if: ${{ always() && github.event.repository.private == false }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require matrix success
        shell: bash
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Public CI matrix did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
